apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.android.databinding'


android {
    compileSdkVersion 34
    buildToolsVersion '30.0.3'
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId "com.gsrtc.mobileweb"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 80
        versionName "7.2.5"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
//multiDexEnabled true
    }
    lintOptions {
        abortOnError false
    }
    dataBinding {
        enabled = true
    }
    packagingOptions {

        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    configurations {
        all {
            exclude module: 'httpclient'
            exclude module: 'commons-logging'
        }
    }
    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    //compile files('libs/surepay_v1.0.1.aar')
    implementation files('libs/soarpayProdV1.2.aar')
    implementation files('libs/pgichecksum.jar')
    implementation files('libs/commons-codec-1.10.jar')


    //aggrepay payment gateway
    implementation project(":pgsdkv5ax")
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.code.ksoap2-android:ksoap2-android:3.6.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'com.daimajia.easing:library:2.0@aar'
    implementation 'com.daimajia.androidanimations:library:2.2@aar'
    implementation 'com.mcxiaoke.volley:library:1.0.1'
    implementation 'com.code-troopers.betterpickers:library:3.1.0'
    implementation 'org.apache.httpcomponents:httpcore:4.4.10'
    implementation 'org.apache.httpcomponents:httpclient:4.5.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'org.jsoup:jsoup:1.13.1'
//    implementation 'com.sun.mail:android-mail:1.5.5'
//    implementation 'com.sun.mail:android-activation:1.5.5'
    implementation 'com.sun.mail:android-mail:1.6.6'
    implementation 'com.sun.mail:android-activation:1.6.6'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "com.squareup.picasso:picasso:2.71828"
    implementation 'androidx.viewpager:viewpager:1.0.0'

    implementation 'com.google.firebase:firebase-crashlytics:17.4.1'
    implementation 'com.google.firebase:firebase-analytics:18.0.3'
    implementation 'com.google.firebase:firebase-messaging:21.1.0'
    implementation 'com.google.firebase:firebase-core:18.0.3'
    implementation 'com.google.firebase:firebase-inappmessaging-display:19.1.5'

    implementation 'com.paytm.appinvokesdk:appinvokesdk:1.6.8'

    implementation 'com.google.android.play:review:2.0.1'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-maps:17.0.1'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'com.google.maps.android:android-maps-utils:0.5'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1'

    testImplementation 'junit:junit:4.13.2'

// gif image implementation
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.3'

}